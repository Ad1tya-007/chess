services:
  postgres:
    image: postgres:18-alpine
    container_name: chess-intelligence-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess_intelligence
    ports:
      # Bound to localhost only; local development credentials must never be publicly reachable.
      - '127.0.0.1:5432:5432'
    volumes:
      # Postgres 18+ images keep versioned data under /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d chess_intelligence']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Production image, for local verification only: `docker compose --profile app up --build`.
  # It reads CHESSCOM_* from .env and listens on http://localhost:3001 without TLS.
  app:
    profiles: ['app']
    build: .
    container_name: chess-intelligence-app
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chess_intelligence
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1
      MCP_ALLOWED_CLIENT_IPS: ''
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      TRUST_PROXY: 0
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
